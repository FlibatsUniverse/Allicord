name: Sync Development
on:
  workflow_run:
    workflows: [Sync Upstream]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: allicord-development-sync
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'FlibatsUniverse/Allicord' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.merge.outputs.state }}
      main: ${{ steps.merge.outputs.main }}
      dev: ${{ steps.merge.outputs.dev }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false
      - id: merge
        name: Prepare integration
        run: |
          git fetch origin upstream dev
          echo "main=$(git rev-parse origin/upstream)" >> "$GITHUB_OUTPUT"
          echo "dev=$(git rev-parse origin/dev)" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor origin/upstream origin/dev; then
            echo 'state=current' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code origin refs/heads/allicord/upstream-sync >/dev/null; then
            git fetch origin allicord/upstream-sync
            git checkout --detach FETCH_HEAD
          fi
          if git merge --no-ff origin/dev -m 'chore(sync): incorporate current Allicord development' && git merge --no-ff origin/upstream -m 'chore(sync): merge Equicord upstream'; then
            echo 'state=merged' >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > conflict-files.txt
            git merge --abort
            echo 'state=conflict' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.8.1
        if: steps.merge.outputs.state == 'merged'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.merge.outputs.state == 'merged'
        with:
          node-version: '24'
          cache: pnpm
      - if: steps.merge.outputs.state == 'merged'
        name: Validate integration
        run: |
          pnpm install --frozen-lockfile
          node scripts/validateWorkflows.mjs
          pnpm testTsc
          pnpm lint
          pnpm lint-styles
          pnpm lint:intl
          pnpm lint:patches
          pnpm generatePluginJson > /dev/null
          pnpm buildStandalone
          pnpm buildWebStandalone
      - id: commit
        if: steps.merge.outputs.state == 'merged'
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git bundle create integration.bundle origin/dev..HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.merge.outputs.state == 'merged' || steps.merge.outputs.state == 'conflict'
        with:
          name: integration
          path: |
            integration.bundle
            conflict-files.txt
          if-no-files-found: error
  publish:
    needs: integrate
    if: needs.integrate.outputs.state == 'merged' || needs.integrate.outputs.state == 'conflict'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: integration
      - name: Publish validated integration or conflict report
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ needs.integrate.outputs.state }}
          MAIN_SHA: ${{ needs.integrate.outputs.main }}
          DEV_SHA: ${{ needs.integrate.outputs.dev }}
          MERGE_SHA: ${{ needs.integrate.outputs.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git fetch origin upstream dev
          [ "$(git rev-parse origin/upstream)" = "$MAIN_SHA" ] && [ "$(git rev-parse origin/dev)" = "$DEV_SHA" ] || { echo 'Branches changed during validation; rerun synchronization'; exit 1; }
          issue=$(gh issue list --state open --search '"Upstream synchronization conflict" in:title' --json number --jq '.[0].number // empty')
          if [ "$STATE" = conflict ]; then
            { printf 'Upstream merge failed at main %s and dev %s.\n\nConflicting files:\n' "$MAIN_SHA" "$DEV_SHA"; cat conflict-files.txt; printf '\nRun: %s\n' "$RUN_URL"; } > report.md
            if [ -n "$issue" ]; then gh issue edit "$issue" --body-file report.md; else gh issue create --title 'Upstream synchronization conflict' --body-file report.md; fi
            exit 0
          fi
          git fetch ./integration.bundle HEAD
          [ "$(git rev-parse FETCH_HEAD)" = "$MERGE_SHA" ] || exit 1
          git merge-base --is-ancestor origin/dev "$MERGE_SHA"
          git merge-base --is-ancestor origin/upstream "$MERGE_SHA"
          branch='allicord/upstream-sync'
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then
            git fetch origin "$branch"
            old=$(git rev-parse FETCH_HEAD)
            if ! git merge-base --is-ancestor "$old" "$MERGE_SHA"; then
              echo 'Existing integration branch contains another validated merge; merge its PR before retrying. No history will be overwritten.'
              exit 1
            fi
          fi
          git push origin "$MERGE_SHA:refs/heads/$branch"
          printf 'Integrates Equicord main %s into Allicord dev %s. Validation passed: %s\n\nAI assistance: Codex configured this automation.\n' "$MAIN_SHA" "$DEV_SHA" "$RUN_URL" > report.md
          pr=$(gh pr list --base dev --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then gh pr edit "$pr" --body-file report.md; else gh pr create --base dev --head "$branch" --title 'chore(sync): integrate Equicord upstream' --body-file report.md; fi
          if [ -n "$issue" ]; then gh issue close "$issue"; fi
