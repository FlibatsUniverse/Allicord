name: Allicord Development Build
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the validated development build'
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: allicord-prerelease-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'FlibatsUniverse/Allicord' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/dev2')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.8.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate
        run: |
          node scripts/validateWorkflows.mjs
          pnpm testTsc
          pnpm lint
          pnpm lint-styles
          pnpm lint:intl
          pnpm lint:patches
          pnpm generatePluginJson > /dev/null
          pnpm buildStandalone
          pnpm buildWebStandalone
      - run: |
          mkdir release
          for name in desktop equibop; do cp "dist/$name.asar" "release/Allicord-$name.asar"; done
          cp dist/Allicord.user.* release/
          for file in dist/*.zip; do cp "$file" "release/Allicord-$(basename "$file")"; done
          cp dist/browser/*.LEGAL.txt release/
          cp LICENSE release/
          git archive --format=tar.gz HEAD > release/Allicord-source.tar.gz
          cd release
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prerelease
          path: release/
  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: prerelease
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release && sha256sum -c SHA256SUMS && cd ..
          version=$(node -p 'require("./package.json").version')
          tag="v$version-${{ github.ref_name }}.${{ github.run_number }}.${{ github.run_attempt }}"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          gh release create "$tag" release/* --verify-tag --prerelease --title "Allicord Development (${{ github.ref_name }}) $GITHUB_SHA" --generate-notes
