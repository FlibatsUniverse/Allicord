name: Allicord Build
on:
  push:
    branches: [dev, dev2, main]
  pull_request:
    branches: [dev, dev2, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: allicord-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fix build timestamp to source commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.8.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate
        run: |
          node scripts/validateWorkflows.mjs
          pnpm testTsc
          pnpm lint
          pnpm lint-styles
          pnpm lint:intl
          pnpm lint:patches
          pnpm generatePluginJson > /dev/null
          pnpm buildStandalone
          pnpm buildWebStandalone
          pnpm generatePluginJson dist/plugins.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Allicord-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  installer:
    name: Build installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.2'
          cache-dependency-path: installer/go.sum
      - name: Test installer
        working-directory: installer
        env:
          EQUICORD_USER_DATA_DIR: ${{ runner.temp }}
          EQUICORD_DIRECTORY: ${{ runner.temp }}/allicord-test.asar
        run: go test -mod=readonly -tags cli ./...
      - name: Build all terminal installers
        working-directory: installer
        env:
          CGO_ENABLED: '0'
          SOURCE_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p ../dist/installers
          version=$(node -p 'require("../package.json").version')
          tag="v$version+build.$BUILD_NUMBER"
          flags="-s -w -X equilotl/buildinfo.InstallerGitHash=$SOURCE_SHA -X equilotl/buildinfo.InstallerTag=$tag"
          for target in windows:amd64:AllicordInstallerCli.exe windows:arm64:AllicordInstallerCli-arm64.exe linux:amd64:AllicordInstaller-linux-x64 linux:arm64:AllicordInstaller-linux-arm64 darwin:amd64:AllicordInstaller-macos-x64 darwin:arm64:AllicordInstaller-macos-arm64; do
            IFS=: read -r os arch name <<< "$target"
            GOOS="$os" GOARCH="$arch" go build -mod=readonly -trimpath -tags cli -ldflags "$flags" -o "../dist/installers/$name" .
          done
          go mod download -json > ../dist/installers/modules.json
          node ../scripts/collectInstallerLicenses.mjs ../dist/installers
          EQUICORD_USER_DATA_DIR="$RUNNER_TEMP" EQUICORD_DIRECTORY="$RUNNER_TEMP/allicord-smoke.asar" ../dist/installers/AllicordInstaller-linux-x64 --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Allicord-installers-${{ github.sha }}
          path: dist/installers/
          if-no-files-found: error

  installer-gui:
    name: Build Windows graphical installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.2'
          cache-dependency-path: installer/go.sum
      - name: Install Windows cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - name: Build graphical installer
        working-directory: installer
        env:
          CGO_ENABLED: '1'
          GOOS: windows
          GOARCH: amd64
          CC: x86_64-w64-mingw32-gcc-posix
          CXX: x86_64-w64-mingw32-g++-posix
          SOURCE_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p ../dist/gui
          version=$(node -p 'require("../package.json").version')
          go build -mod=readonly -trimpath -tags 'static gui' -ldflags "-s -w -H=windowsgui -extldflags=-static -X equilotl/buildinfo.InstallerGitHash=$SOURCE_SHA -X equilotl/buildinfo.InstallerTag=v$version+build.$BUILD_NUMBER" -o ../dist/gui/AllicordInstaller.exe .
          mkdir -p ../dist/gui/licenses
          for file in /usr/share/doc/*mingw*/copyright /usr/share/doc/gcc-*-base/copyright; do
            cp "$file" "../dist/gui/licenses/$(basename "$(dirname "$file")").copyright"
          done
          cp /usr/share/common-licenses/GPL-3 /usr/share/common-licenses/LGPL-3 /usr/share/common-licenses/LGPL-2.1 ../dist/gui/licenses/
          tar -czf ../dist/gui/Allicord-gui-licenses.tar.gz -C ../dist/gui licenses
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Allicord-gui-${{ github.sha }}
          path: dist/gui/
          if-no-files-found: error
